[project]
name = "recursivegitupdate"
version = "1.18.0"
description = "Recursively update GIT or SVN folders."
authors = [{ name = "Ixtalo", email = "ixtalo@users.noreply.github.com" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["git", "svn", "pull", "update", "recursive"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.27",
    "loguru>=0.7",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
recursive-git-update = "recursivegitupdate.cli:app"

[dependency-groups]
dev = [
    "pre-commit",
    # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "ruff==0.16.8",
    "pytest>=8",
    "pytest-sugar",
    "pytest-cov",
    "pytest-clarity",
    "pytest-icdiff",
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "recursivegitupdate" }]

## https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "PL",      # pylint
    "RUF",     # ruff-specific
]
ignore = [
    "PLR2004",  # magic values in comparisons
]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLC0415"]

## https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

## https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
source = ["recursivegitupdate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
